name: CI/CD

# Every push and pull request builds and packages the app. Pushing a v* tag (e.g. v1.2.0)
# also publishes a GitHub release with the disk image.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and package
    runs-on: macos-26 # Apple silicon; its Xcode must ship Swift 6.3+ (mlx-swift)
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signing.outputs.signed }}
      notarized: ${{ steps.signing.outputs.notarized }}
    env:
      # Optional. When set, the app is signed with Developer ID and notarized (see README › Releases).
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        id: signing
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 doesn't contain a Developer ID Application identity."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

          if [ -n "$NOTARY_KEY_P8" ]; then
            printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: ./scripts/build.sh

      - name: Package
        run: ./scripts/package.sh

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload disk image
        uses: actions/upload-artifact@v7
        with:
          name: OpenSpell-${{ steps.version.outputs.version }}
          path: |
            build/OpenSpell-*.dmg
            build/OpenSpell-*.dmg.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      SIGNED: ${{ needs.build.outputs.signed }}
      NOTARIZED: ${{ needs.build.outputs.notarized }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: OpenSpell-${{ needs.build.outputs.version }}
          path: dist

      - name: Write release notes
        run: |
          {
            echo "## Install"
            echo
            echo "1. Download **OpenSpell-$VERSION.dmg** below and open it."
            echo "2. Drag **OpenSpell** to **Applications**, then open it from there."
            if [ "$NOTARIZED" != "true" ]; then
              echo "3. This build isn't notarized by Apple, so macOS blocks the first launch. Open **System Settings › Privacy & Security**, scroll down and click **Open Anyway**."
            fi
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "> [!NOTE]"
              echo "> This build isn't signed with a Developer ID, so after each update macOS asks you to allow OpenSpell in Accessibility again."
            fi
            echo
            echo "Requires macOS 15 or later on an Apple silicon Mac. To verify the download, run \`shasum -a 256 -c OpenSpell-$VERSION.dmg.sha256\`."
          } > notes.md

      - name: Publish
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            FLAGS=()
            if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
            gh release create "$TAG" dist/* --title "OpenSpell $VERSION" --notes-file notes.md --generate-notes "${FLAGS[@]}"
          fi
